name: Build Linux AppImage

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar Executavel (Windows MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar Solucao (Release x64)
        run: |
          msbuild DiskInfo.sln /p:Configuration=Release /p:Platform=x64 /p:OutDir="${{ github.workspace }}\build_output\" /m

      - name: Preparar Artefatos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item -Path "build_output\DiskInfo64.exe" -Destination "dist\DiskInfo64.exe" -Force
          Copy-Item -Path "Language" -Destination "dist\Language" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "res" -Destination "dist\res" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload Binarios Windows
        uses: actions/upload-artifact@v4
        with:
          name: crystaldiskinfo-win64
          path: dist/
          retention-days: 1

  package-appimage:
    name: Empacotar Linux AppImage (Wine Wrapper)
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Baixar Binarios Compilados
        uses: actions/download-artifact@v4
        with:
          name: crystaldiskinfo-win64
          path: dist/

      - name: Instalar Ferramentas de Imagem
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick icnsutils wget

      - name: Estruturar AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/opt/crystaldiskinfo

          cp -r dist/* AppDir/opt/crystaldiskinfo/

          # Gerar icone da aplicacao
          if [ -f "res/DiskInfo.ico" ]; then
            convert "res/DiskInfo.ico[0]" AppDir/usr/share/icons/hicolor/256x256/apps/crystaldiskinfo.png || true
            cp AppDir/usr/share/icons/hicolor/256x256/apps/crystaldiskinfo.png AppDir/crystaldiskinfo.png || true
          fi

          # Criar arquivo de lancador .desktop
          cat << 'EOF' > AppDir/crystaldiskinfo.desktop
          [Desktop Entry]
          Type=Application
          Name=CrystalDiskInfo
          Comment=Disk Health Monitoring Tool
          Exec=AppRun
          Icon=crystaldiskinfo
          Categories=Utility;System;
          Terminal=false
          EOF
          cp AppDir/crystaldiskinfo.desktop AppDir/usr/share/applications/

          # Criar script de execucao AppRun com integracao Wine
          cat << 'EOF' > AppDir/AppRun
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export WINEPREFIX="${HOME}/.crystaldiskinfo-wine"
          export WINEDEBUG="-all"

          if ! command -v wine &> /dev/null; then
            echo "Wine nao encontrado. Instale com: sudo apt install wine"
            if command -v zenity &> /dev/null; then
              zenity --error --text="Wine nao encontrado no sistema.\nExecute no terminal: sudo apt install wine"
            fi
            exit 1
          fi

          EXE_PATH="${HERE}/opt/crystaldiskinfo/DiskInfo64.exe"
          if [ ! -f "$EXE_PATH" ]; then
            EXE_PATH=$(find "${HERE}/opt/crystaldiskinfo" -name "*.exe" | head -n 1)
          fi

          if [ -z "$EXE_PATH" ]; then
            echo "Erro: Executavel DiskInfo64.exe nao encontrado."
            exit 1
          fi

          exec wine "$EXE_PATH" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Gerar AppImage via appimagetool
        run: |
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir CrystalDiskInfo-x86_64.AppImage

      - name: Publicar Artefato AppImage
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDiskInfo-Linux-x86_64.AppImage
          path: CrystalDiskInfo-x86_64.AppImage
