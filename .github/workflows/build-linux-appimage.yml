name: Build Native Linux AppImage (QDiskInfo Qt6)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-native-appimage:
    name: Compilar QDiskInfo ELF e Gerar AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Clonar codigo-fonte nativo (QDiskInfo)
        run: |
          git clone --depth 1 https://github.com/edisionnano/QDiskInfo.git qdiskinfo-src

      - name: Instalar Dependencias de Compilacao e Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqt6svg6-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            smartmontools \
            wget \
            file

      - name: Compilar Binario ELF via CMake
        run: |
          cmake -S qdiskinfo-src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_TRANSLATIONS=ON
          cmake --build build -j$(nproc)
          DESTDIR="$(pwd)/AppDir" cmake --install build

      - name: Preparar AppDir
        run: |
          # Garantir links raiz para compatibilidade AppImage
          cp -f AppDir/usr/share/applications/*.desktop AppDir/ 2>/dev/null || true
          cp -f AppDir/usr/share/icons/hicolor/256x256/apps/*.png AppDir/ 2>/dev/null || true

      - name: Baixar linuxdeploy e plugin Qt
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Empacotar AppImage com Bibliotecas Qt6
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt6/bin/qmake
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage
          
          # Padronizar nome do artefato final
          mv QDiskInfo*.AppImage QDiskInfo-Linux-x86_64.AppImage

      - name: Publicar Artefato AppImage Nativo
        uses: actions/upload-artifact@v4
        with:
          name: QDiskInfo-Linux-x86_64.AppImage
          path: QDiskInfo-Linux-x86_64.AppImage

      - name: Publicar Script de Instalacao do Host
        uses: actions/upload-artifact@v4
        with:
          name: install-smartmontools.sh
          path: install-smartmontools.sh
